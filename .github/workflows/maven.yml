#this workflow will build the project
name: Java Build

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  #run manually
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github

      - name: Set up Apache Maven 4.1.0
        uses: stcarolas/setup-maven@v5
        with:
          maven-version: '4.0.0-rc-7'

      #no caching necessary

      - name: Build with Maven
        run: mvn -B package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
