# this workflow will deploy the artifact to my Maven repository
name: Java CI with Maven and Deploy

on:
  release:
    types: [created]

  #run manually
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Apache Maven 4.1.0
        uses: stcarolas/setup-maven@v5
        with:
          maven-version: '4.0.0-rc-7'

      #no caching necessary

      - name: Build and deploy with Maven
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/settings.xml -B package deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTION_PAT: ${{ secrets.ACTION_PAT }}
